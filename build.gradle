// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {


    ext {
        /*sdk and version*/
        compile_sdk_version = 29
        min_sdk_version = 21
        target_sdk_version = 29
        constraint_version = '1.1.0'
        version_code = 229
        version_name = '2.2.9'


        signConfigs = [
                storeFilePath: "zxing.jks",
                storePwd     : "123456",
                keyAlias     : "zxingyzq",
                keypwd       : "123456"
        ]

    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.1'

        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

allprojects {

    group "YuZhiQiang"
    repositories {
        google()
        maven { url "https://jitpack.io" }
        mavenCentral()
    }

    // 全局配置：让所有模块优先加载自定义 framework.jar（核心）
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            // 注意：framework.jar 路径为「工程根目录/libs/framework/」，需提前创建
            def frameworkJar = new File(rootProject.rootDir, "libs/framework/framework.jar")
            if (frameworkJar.exists()) {
                options.compilerArgs.add('-Xbootclasspath/p:' + frameworkJar.absolutePath)
            }
            // 关闭无关警告，聚焦核心编译
            options.compilerArgs.add('-Xlint:unchecked')
            options.compilerArgs.add('-Xlint:deprecation')
        }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
