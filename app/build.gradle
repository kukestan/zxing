apply plugin: 'com.android.application'

android {
    compileSdkVersion compile_sdk_version
    defaultConfig {
        applicationId "com.yzq.zxing"
        minSdkVersion min_sdk_version
        targetSdkVersion target_sdk_version
        versionCode version_code
        versionName version_name
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
    }

    // 核心：解决 framework.jar 与系统类冲突
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        // 仅保留你新增的自定义类（替换为你的实际类名）
        //pickFirst 'android/os/CustomFrameworkManager.class'
        // 排除系统重复类（避免编译冲突）
        //exclude 'android/os/Bundle.class'
        //exclude 'android/app/Activity.class'
    }

    // 禁用 lint 错误阻断编译（适配系统应用）
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    // 编译选项：适配 Java 8（兼容 Android 10）
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')


    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation "androidx.vectordrawable:vectordrawable:1.1.0"
    implementation "androidx.annotation:annotation:1.2.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.yanzhenjie:permission:2.0.2'
//    implementation project(':zxinglibrary')
    implementation 'com.github.yuzhiqiang1993:zxing:2.2.9'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    // 核心：将 framework.jar 作为编译依赖（仅编译时用，不打包进APK）
    // 路径：工程根目录/libs/framework/framework.jar
    compileOnly files("$rootProject.rootDir/libs/framework/framework.jar")
}
